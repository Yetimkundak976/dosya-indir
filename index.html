<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosya İndirme Merkezi</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            background: #1e1e1e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .loader {
            border: 4px solid #333;
            border-radius: 50%;
            border-top: 4px solid #00adb5;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #aaaaaa; }
        a { color: #00adb5; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dosyanız İndiriliyor...</h1>
    <div class="loader"></div>
    <p>İndirme otomatik başlamadıysa <a id="downloadLink" href="Noxroli.txt" download>buraya tıklayın</a>.</p>
</div>

<script>
    window.onload = function() {
        setTimeout(function() {
            document.getElementById('downloadLink').click();
        }, 1500);
    };
</script>

</body>
</html>
